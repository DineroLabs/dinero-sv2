# Miner release pipeline — fires on tags `miner-vX.Y.Z` (kept clear of
# pool/protocol tags). Builds the CPU miner for all five public targets
# (incl. BOTH macOS architectures — the Intel slice cross-compiles from
# the arm64 runner), assembles SHA256SUMS, and publishes a GitHub
# release with every CPU and GPU asset. GPU targets cover Metal on both
# supported macOS architectures and OpenCL on Linux/Windows x86_64.
#
# macOS signing/notarization runs LOCALLY, not in CI: after the workflow
# publishes, sign BOTH darwin assets (aarch64 AND x86_64) on the Mac
#   codesign --force --options runtime \
#     --sign 'Developer ID Application: DineroLabs LLC (JXJS6ZA5FJ)' dinero-sv2-miner-aarch64-apple-darwin
#   xcrun notarytool submit ... --keychain-profile dinero-notarytool --wait
# then replace the release asset (gh release upload --clobber) AND
# regenerate + re-upload SHA256SUMS so the sums match the signed binary.
name: miner-release

on:
  push:
    tags: ["miner-v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # `release` environment carries the Azure OIDC federation for Windows
    # code signing (subject repo:DineroLabs/dinero-sv2:environment:release).
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            ext: ""
            package: dinero-sv2-miner
            bin: dinero-sv2-miner
          - target: x86_64-apple-darwin
            os: macos-14
            ext: ""
            package: dinero-sv2-miner
            bin: dinero-sv2-miner
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            package: dinero-sv2-miner
            bin: dinero-sv2-miner
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            use_cross: true
            package: dinero-sv2-miner
            bin: dinero-sv2-miner
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            package: dinero-sv2-miner
            bin: dinero-sv2-miner
          - target: aarch64-apple-darwin
            os: macos-14
            ext: ""
            package: dinero-sv2-gpu-miner
            bin: dinero-sv2-gpu-miner
            gpu: true
          - target: x86_64-apple-darwin
            os: macos-14
            ext: ""
            package: dinero-sv2-gpu-miner
            bin: dinero-sv2-gpu-miner
            gpu: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            package: dinero-sv2-gpu-miner
            bin: dinero-sv2-gpu-miner
            gpu: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            package: dinero-sv2-gpu-miner
            bin: dinero-sv2-gpu-miner
            gpu: true
    steps:
      - uses: actions/checkout@v4

      - name: Require release version identity
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#miner-v}"
          test "$(sed -n 's/^version     = "\([^"]*\)"/\1/p' crates/dinero-sv2-miner/Cargo.toml)" = "$VERSION"
          test "$(sed -n 's/^version     = "\([^"]*\)"/\1/p' crates/dinero-sv2-gpu-miner/Cargo.toml)" = "$VERSION"

      - name: Require Windows signing identity
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: test '${{ vars.WINDOWS_SIGNING_READY }}' = 'true'

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.use_cross == true }}
        run: cargo install cross --locked

      - name: Install Linux OpenCL development library
        if: ${{ matrix.gpu == true && runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev

      - name: Install Windows OpenCL import library
        if: ${{ matrix.gpu == true && runner.os == 'Windows' }}
        shell: powershell
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install opencl:x64-windows --no-print-usage
          $openclRoot = Join-Path $env:RUNNER_TEMP 'opencl-sdk'
          New-Item (Join-Path $openclRoot 'lib\x64') -ItemType Directory -Force | Out-Null
          Copy-Item `
            "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\OpenCL.lib" `
            (Join-Path $openclRoot 'lib\x64\OpenCL.lib')
          "INTELOCLSDKROOT=$openclRoot" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Build (cross)
        if: ${{ matrix.use_cross == true }}
        run: cross build --release --locked -p ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ matrix.use_cross != true }}
        run: cargo build --release --locked -p ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}${{ matrix.ext }}" \
             "dist/${{ matrix.bin }}-${{ matrix.target }}${{ matrix.ext }}"

      # Windows Authenticode signing via Azure Artifact Signing (Trusted
      # Signing). Gated on the WINDOWS_SIGNING_READY repo variable so tags
      # cut before the identity validation clears still release unsigned
      # rather than failing. Flip the variable to 'true' once the
      # certificate profile exists.
      - name: Azure login (OIDC)
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binary
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: assemble SHA256SUMS + publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: assets
        run: |
          sha256sum dinero-sv2-miner-* dinero-sv2-gpu-miner-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: true
          body: |
            One-command install (macOS / Linux / Chromebook Crostini):

            ```sh
            curl -fsSL https://raw.githubusercontent.com/DineroLabs/dinero-sv2/main/scripts/install.sh | sh
            ```

            Windows (PowerShell):

            ```powershell
            irm https://raw.githubusercontent.com/DineroLabs/dinero-sv2/main/scripts/install.ps1 | iex
            ```

            Then start shared CPU mining with an explicit reward address:

            ```sh
            cd "$HOME/.local/bin" && ./dinero-miner --address "YOUR_DIN1_ADDRESS" --reward-mode shared --threads 2
            ```

            The interactive dashboard keeps Dinero pinned at the top, displays
            the complete reward address, and devotes 31 rows to full 256-bit
            candidate hashes. It also shows Noise NX security, pool/channel
            state, accepted and rejected shares, session work, reconnect health,
            and a timestamped network feed. `Ctrl-C` restores the original shell.
            No node or chain sync is required. Verify downloads against
            `SHA256SUMS`.

            **Behavior change:** an unspecified `--reward-mode` now resolves
            to `shared` (previously `solo`). Pass `--reward-mode solo` to
            keep miner-owned all-or-nothing coinbases.

            This release ships both CPU and GPU miners. The GPU binaries use
            Metal on macOS and OpenCL on Linux/Windows. Both variants share
            the same authenticated SV2 transport and interactive terminal UX.
