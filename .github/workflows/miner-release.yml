# Miner release pipeline — fires on tags `miner-vX.Y.Z` (kept clear of
# pool/protocol tags). Builds the CPU miner for all five public targets
# (incl. BOTH macOS architectures — the Intel slice cross-compiles from
# the arm64 runner), assembles SHA256SUMS, and publishes a GitHub
# release with every CPU and GPU asset. GPU targets cover Metal on both
# supported macOS architectures and OpenCL on Linux/Windows x86_64.
#
# macOS signing/notarization runs LOCALLY, not in CI: after the workflow
# publishes, sign BOTH darwin assets (aarch64 AND x86_64) on the Mac
#   codesign --force --options runtime \
#     --sign 'Developer ID Application: DineroLabs LLC (JXJS6ZA5FJ)' dinero-sv2-miner-aarch64-apple-darwin
#   xcrun notarytool submit ... --keychain-profile dinero-notarytool --wait
# then replace the release asset (gh release upload --clobber) AND
# regenerate + re-upload SHA256SUMS so the sums match the signed binary.
name: miner-release

on:
  workflow_dispatch:
    inputs:
      candidate_source:
        description: 'Full reviewed commit SHA; Actions artifacts only'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/miner-release.yml'
      - 'scripts/test_miner_candidate_identity.py'
  push:
    tags: ["miner-v*"]

permissions:
  contents: write

jobs:
  candidate-contract:
    name: Miner candidate identity guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 scripts/test_miner_candidate_identity.py

  build:
    if: github.event_name != 'pull_request'
    needs: candidate-contract
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # `release` environment carries the Azure OIDC federation for Windows
    # code signing (subject repo:DineroLabs/dinero-sv2:environment:release).
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            ext: ""
            package: dinero-sv2-miner
            bin: dinero-sv2-miner
          - target: x86_64-apple-darwin
            os: macos-14
            ext: ""
            package: dinero-sv2-miner
            bin: dinero-sv2-miner
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            package: dinero-sv2-miner
            bin: dinero-sv2-miner
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            use_cross: true
            package: dinero-sv2-miner
            bin: dinero-sv2-miner
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            package: dinero-sv2-miner
            bin: dinero-sv2-miner
          - target: aarch64-apple-darwin
            os: macos-14
            ext: ""
            package: dinero-sv2-gpu-miner
            bin: dinero-sv2-gpu-miner
            gpu: true
          - target: x86_64-apple-darwin
            os: macos-14
            ext: ""
            package: dinero-sv2-gpu-miner
            bin: dinero-sv2-gpu-miner
            gpu: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            package: dinero-sv2-gpu-miner
            bin: dinero-sv2-gpu-miner
            gpu: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            package: dinero-sv2-gpu-miner
            bin: dinero-sv2-gpu-miner
            gpu: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_source || github.ref }}

      - name: Require immutable source and version identity
        shell: bash
        env:
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
        run: |
          CPU_VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' crates/dinero-sv2-miner/Cargo.toml)"
          GPU_VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' crates/dinero-sv2-gpu-miner/Cargo.toml)"
          [[ "$CPU_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$CPU_VERSION" = "$GPU_VERSION"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$CANDIDATE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
            test "$GITHUB_REF_TYPE" != tag
            test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE"
            echo "candidate=$CANDIDATE_SOURCE version=$CPU_VERSION"
          else
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF_TYPE" = tag
            test "$GITHUB_REF_NAME" = "miner-v$CPU_VERSION"
          fi

      - name: Require Windows signing identity
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: test '${{ vars.WINDOWS_SIGNING_READY }}' = 'true'

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.use_cross == true }}
        run: cargo install cross --locked

      - name: Install Linux OpenCL development library
        if: ${{ matrix.gpu == true && runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev

      - name: Install Windows OpenCL import library
        if: ${{ matrix.gpu == true && runner.os == 'Windows' }}
        shell: powershell
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install opencl:x64-windows --no-print-usage
          $openclRoot = Join-Path $env:RUNNER_TEMP 'opencl-sdk'
          New-Item (Join-Path $openclRoot 'lib\x64') -ItemType Directory -Force | Out-Null
          Copy-Item `
            "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\OpenCL.lib" `
            (Join-Path $openclRoot 'lib\x64\OpenCL.lib')
          "INTELOCLSDKROOT=$openclRoot" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Build (cross)
        if: ${{ matrix.use_cross == true }}
        run: cross build --release --locked -p ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ matrix.use_cross != true }}
        run: cargo build --release --locked -p ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}${{ matrix.ext }}" \
             "dist/${{ matrix.bin }}-${{ matrix.target }}${{ matrix.ext }}"

      # Windows Authenticode signing via Azure Artifact Signing (Trusted
      # Signing). Gated on the WINDOWS_SIGNING_READY repo variable so tags
      # cut before the identity validation clears still release unsigned
      # rather than failing. Flip the variable to 'true' once the
      # certificate profile exists.
      - name: Azure login (OIDC)
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binary
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe

      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          python-version: '3.12'

      - name: Record candidate provenance and final hashes
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CANDIDATE_TARGET: ${{ matrix.target }}
          CANDIDATE_BIN: ${{ matrix.bin }}
          CANDIDATE_EXT: ${{ matrix.ext }}
        run: |
          python - <<'PY_CANDIDATE'
          import hashlib, json, os, pathlib, subprocess
          target, binary, ext = (os.environ[k] for k in ('CANDIDATE_TARGET', 'CANDIDATE_BIN', 'CANDIDATE_EXT'))
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1']))
          version = next(p['version'] for p in metadata['packages'] if p['name'] == binary)
          path = pathlib.Path('dist') / f'{binary}-{target}{ext}'
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          record = {'schema': 1, 'repository': 'DineroLabs/dinero-sv2',
                    'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'workflow_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                    'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'component': binary,
                    'version': version, 'target': target, 'asset': path.name, 'sha256': digest,
                    'size_bytes': path.stat().st_size, 'runtime_qualified': False}
          receipt = path.parent / f'candidate-{binary}-{target}.json'
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          receipt_hash = hashlib.sha256(receipt.read_bytes()).hexdigest()
          (path.parent / f'SHA256SUMS-{binary}-{target}').write_text(
              f'{digest}  {path.name}\n{receipt_hash}  {receipt.name}\n')
          print(json.dumps(record, indent=2))
          PY_CANDIDATE

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: assemble SHA256SUMS + publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: assets
        run: |
          sha256sum dinero-sv2-miner-* dinero-sv2-gpu-miner-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: true
          body: |
            One-command install (macOS / Linux / Chromebook Crostini):

            ```sh
            curl -fsSL https://raw.githubusercontent.com/DineroLabs/dinero-sv2/main/scripts/install.sh | sh
            ```

            Windows (PowerShell):

            ```powershell
            irm https://raw.githubusercontent.com/DineroLabs/dinero-sv2/main/scripts/install.ps1 | iex
            ```

            Then start shared CPU mining with an explicit reward address:

            ```sh
            cd "$HOME/.local/bin" && ./dinero-miner --address "YOUR_DIN1_ADDRESS" --reward-mode shared --threads 2
            ```

            The interactive dashboard keeps Dinero pinned at the top, displays
            the complete reward address, the current mining height, and the
            active parent-block hash so miners can detect a pool working on a
            different chain tip. It devotes 31 rows to full 256-bit candidate
            hashes and also shows Noise NX security, pool/channel state,
            accepted and rejected shares, session work, reconnect health, and a
            timestamped network feed. `Ctrl-C` restores the original shell. No
            node or chain sync is required. Verify downloads against
            `SHA256SUMS`.

            **Behavior change:** an unspecified `--reward-mode` now resolves
            to `shared` (previously `solo`). Pass `--reward-mode solo` to
            keep miner-owned all-or-nothing coinbases.

            This release ships both CPU and GPU miners. The GPU binaries use
            Metal on macOS and OpenCL on Linux/Windows. Both variants share
            the same authenticated SV2 transport and interactive terminal UX.

            GPU install (separate script, installs alongside the CPU miner
            rather than replacing it):

            ```sh
            curl -fsSL https://raw.githubusercontent.com/DineroLabs/dinero-sv2/main/scripts/install-gpu.sh | sh
            ```

            ```powershell
            irm https://raw.githubusercontent.com/DineroLabs/dinero-sv2/main/scripts/install-gpu.ps1 | iex
            ```

            Then start shared GPU mining. Note this is NOT the CPU command:
            the GPU miner has no `--threads`. It takes `--backend`, defaulting
            to `auto` (Metal on macOS, else CUDA when present, else OpenCL).

            ```sh
            cd "$HOME/.local/bin" && ./dinero-gpu-miner --address "YOUR_DIN1_ADDRESS" --reward-mode shared
            ```

            There is no GPU binary for Linux aarch64; that platform is
            CPU-only and the installer says so rather than failing on a
            missing download.
