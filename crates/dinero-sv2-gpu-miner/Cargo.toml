[package]
name        = "dinero-sv2-gpu-miner"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
authors     = { workspace = true }
rust-version = { workspace = true }
description = "Dinero Stratum V2 GPU miner — Metal on Apple Silicon, OpenCL on Linux/Windows, SV2 + Job Declaration"

[[bin]]
name = "dinero-sv2-gpu-miner"
path = "src/main.rs"

[dependencies]
dinero-miner-ux      = { path = "../dinero-miner-ux" }
dinero-sv2-common    = { workspace = true }
dinero-sv2-codec     = { workspace = true }
dinero-sv2-transport = { workspace = true }
dinero-sv2-jd        = { workspace = true }
anyhow     = { workspace = true }
hex        = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true, features = ["signal"] }
clap       = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
sha2       = { workspace = true }

[features]
default = []
# Native NVIDIA CUDA backend (cudarc + NVRTC). Opt-in via `--features cuda`
# (NOT default-on). Default workspace builds/tests require no CUDA toolkit
# and no NVIDIA driver. With `cuda`, cudarc dynamic-loads the driver +
# NVRTC at runtime, so the binary still builds on hosts without CUDA — the
# driver/NVRTC only need to be present when `--backend cuda` actually runs.
# Implemented in src/cuda_backend.rs (gated to non-macOS).
cuda = ["dep:cudarc"]

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.27"
objc  = "0.2"
core-graphics-types = "0.1"

# Linux + Windows GPU backends.
#
# `ocl` 0.19 wraps OpenCL 1.2; works on AMD ROCm, NVIDIA, Intel, and Mesa.
# Tested OpenCL target: AMD Radeon Pro WX 2100 on the Dell Tower.
#
# `cudarc` 0.13: CUDA Driver API + NVRTC bindings with the dynamic-loading
# variant so the binary does NOT link against the CUDA toolkit at build time.
# The driver + NVRTC only need to be present when `--backend cuda` runs.
# Tested target: NVIDIA GeForce RTX 4060 (sm_89, Ada Lovelace), CUDA 12.2.
[target.'cfg(not(target_os = "macos"))'.dependencies]
ocl    = "0.19"
cudarc = { version = "0.13", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-linking", "cuda-12020"], optional = true }
