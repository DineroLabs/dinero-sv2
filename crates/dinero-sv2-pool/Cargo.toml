[package]
name        = "dinero-sv2-pool"
# Versioned independently of the workspace, exactly as dinero-sv2-miner is:
# the pool ships on its own `pool-v*` cadence, and inheriting the workspace
# 0.1.0 meant pool-v0.1.1 produced a binary whose --version said 0.1.0 —
# leaving a broken build and its fix indistinguishable to whoever held it.
# The release workflow now fails if this disagrees with the tag.
version     = "0.1.3"
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
authors     = { workspace = true }
rust-version = { workspace = true }
description = "Dinero Stratum V2 reference pool server — accepts miners, credits shares, submits found blocks"

[[bin]]
name = "dinero-sv2-pool"
path = "src/main.rs"

[dependencies]
dinero-sv2-common    = { workspace = true }
dinero-sv2-codec     = { workspace = true }
dinero-sv2-transport = { workspace = true }
dinero-sv2-jd        = { workspace = true }
anyhow     = { workspace = true }
thiserror  = { workspace = true }
hex        = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
reqwest    = { workspace = true }
base64     = { workspace = true }
tokio      = { workspace = true }
clap       = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
sha2       = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"
